name: OPEN-83 Validator Fixtures

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/open83-validator-fixtures.yml"
      - "open83/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/open83-validator-fixtures.yml"
      - "open83/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open83-validator-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validator-fixtures:
    name: Run OPEN-83 validator fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r open83/requirements.txt

      - name: Run fixture tests
        shell: pwsh
        run: |
          ./open83/tests/run_fixture_tests.ps1
