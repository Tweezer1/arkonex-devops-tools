name: OPEN-83 Validator Fixtures

on:
  pull_request:
    branches:
      - main
    paths:
      - ".gitattributes"
      - ".github/workflows/open83-validator-fixtures.yml"
      - "open83/**"
  push:
    branches:
      - main
    paths:
      - ".gitattributes"
      - ".github/workflows/open83-validator-fixtures.yml"
      - "open83/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open83-validator-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validator-fixtures:
    name: Run OPEN-83 validator fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check repository text hygiene
        shell: bash
        run: |
          set -euo pipefail

          git diff --check HEAD~1 HEAD

          git check-attr text eol -- \
            .gitattributes \
            open83/tests/run_fixture_tests.ps1 \
            .github/workflows/open83-validator-fixtures.yml | tee /tmp/open83-attrs.txt

          grep -F ".gitattributes: text: set" /tmp/open83-attrs.txt
          grep -F ".gitattributes: eol: lf" /tmp/open83-attrs.txt
          grep -F "open83/tests/run_fixture_tests.ps1: text: set" /tmp/open83-attrs.txt
          grep -F "open83/tests/run_fixture_tests.ps1: eol: lf" /tmp/open83-attrs.txt
          grep -F ".github/workflows/open83-validator-fixtures.yml: text: set" /tmp/open83-attrs.txt
          grep -F ".github/workflows/open83-validator-fixtures.yml: eol: lf" /tmp/open83-attrs.txt

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r open83/requirements.txt

      - name: Run fixture tests
        shell: pwsh
        run: |
          ./open83/tests/run_fixture_tests.ps1
